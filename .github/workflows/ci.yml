name: CI

on:
  push:
    branches: [main, master, develop]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main, master]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dev deps and async extra
        run: uv sync --extra dev --extra async ${{ matrix.python-version == '3.12' && '--extra docs' || '' }}

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy remote_cmd

      - name: Test with pytest
        run: uv run pytest -v --tb=short --cov=remote_cmd --cov-report=xml --cov-report=term-missing

      - name: Verify API docs generation (3.12 only)
        if: matrix.python-version == '3.12'
        run: uv run pdoc remote_cmd -o /tmp/pdoc-check

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
