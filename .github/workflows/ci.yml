name: CI

on:
  push:
    branches: [main, master, develop]
    # 忽略纯 Markdown 变更，但 CHANGELOG.md 例外：它承载发布元数据
    # （[Unreleased] / 版本标题），必须触发 CI 内的 metadata 校验。
    # paths-ignore 不支持例外，故用 paths + 负模式表达。
    paths:
      - "**"
      - "!**.md"
      - "CHANGELOG.md"
  pull_request:
    branches: [main, master]
    paths:
      - "**"
      - "!**.md"
      - "CHANGELOG.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FORCE_COLOR: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # Reduce matrix size: only test 3.12 on macOS/Windows, full matrix on Linux
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dev deps and async extra
        run: uv sync --extra dev --extra async ${{ matrix.python-version == '3.12' && '--extra docs' || '' }}

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check with mypy
        run: uv run mypy remote_cmd

      - name: Test with pytest
        run: uv run pytest -v --tb=short --cov=remote_cmd --cov-report=xml --cov-report=term-missing

      - name: Check API docs are up to date (3.12 only)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: uv run python scripts/check_docs_drift.py

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Audit runtime dependencies (blocking)
        run: |
          echo "Audit scope: installed runtime dependencies (the local project itself is not on PyPI and is skipped by pip-audit)"
          uv venv /tmp/audit-runtime
          uv pip install --python /tmp/audit-runtime/bin/python .
          uv pip install --python /tmp/audit-runtime/bin/python pip-audit
          /tmp/audit-runtime/bin/python -m pip_audit

      - name: Audit dev tooling (advisory)
        continue-on-error: true
        run: |
          echo "Audit scope: dev tooling only (advisory; runtime audit above is the blocking gate)"
          uv venv /tmp/audit-dev
          uv pip install --python /tmp/audit-dev/bin/python -e ".[dev]"
          uv pip install --python /tmp/audit-dev/bin/python pip-audit
          /tmp/audit-dev/bin/python -m pip_audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}