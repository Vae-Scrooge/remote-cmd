name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version / CHANGELOG metadata
        run: python scripts/check_release_metadata.py

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        run: python scripts/check_release_metadata.py --tag "${{ github.ref_name }}"

      - name: Build package
        run: python -m build

      - name: Check distributions with twine
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/

  publish-testpypi:
    name: Publish to Test PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/remote-cmd-manager
    permissions:
      id-token: write
    if: github.event.inputs.environment == 'testpypi' && github.event_name == 'workflow_dispatch'
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/remote-cmd-manager
    permissions:
      id-token: write
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'pypi')
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
