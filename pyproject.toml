[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote_cmd_manager"
dynamic = ["version"]
description = "Cross-platform SSH remote server management tool (Linux/macOS/Windows) — lightweight, zero-configuration CLI and Python API for managing servers over SSH. Supports host CRUD, batch commands, file transfer, credential encryption, async execution, and more."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vae-Scrooge", email = "vaescrooge@gmail.com" },
]
keywords = ["ssh", "remote", "server-management", "sysadmin", "devops", "cross-platform"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "paramiko>=5.0,<6",
    "click>=8.0",
    "cryptography>=41.0",
    "rich>=13.0",
    "PyYAML>=6.0",
    "aiofiles>=3.0",
]

[project.optional-dependencies]
# 异步原生执行内核：启用 BatchExecutor(use_async=True) / AsyncSSHClient / AsyncConnectionPool 时需要
# 下限锁定在 2.24.x：2.23.x 及更早版本存在 2026 年公开 CVE（SCP 路径穿越等）。
async = ["asyncssh>=2.24.0,<3"]
# 云平台主机发现（Phase 4 预留）
cloud = ["boto3>=1.34"]
# 开发与测试
# 包含 async extra：默认测试套件会 import 异步模块，仅装 dev 无法收集。
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "asyncssh>=2.24.0,<3",
    # 测试 keyring 凭据提供者（生产为可选依赖，测试环境固定安装）
    "keyring>=24.0",
]
# 文档生成。pdoc 固定到 15.0.4：docs/api 漂移门禁（scripts/check_docs_drift.py）
# 要求生成结果可复现。
docs = ["pdoc==15.0.4"]

[project.urls]
Homepage = "https://github.com/Vae-Scrooge/remote-cmd"
Repository = "https://github.com/Vae-Scrooge/remote-cmd"
Documentation = "https://github.com/Vae-Scrooge/remote-cmd#readme"
"Bug Tracker" = "https://github.com/Vae-Scrooge/remote-cmd/issues"
Download = "https://pypi.org/project/remote_cmd_manager/"

[project.scripts]
remote-cmd = "remote_cmd.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "remote_cmd._version.__version__" }

[tool.setuptools.packages.find]
include = ["remote_cmd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not benchmark and not integration'"
python_files = ["test_*.py"]
markers = [
    "asyncio: async test",
    "benchmark: performance benchmark (run explicitly with -m benchmark)",
    "integration: integration test requiring Docker/testcontainers",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "BLE", # blind except
    "B",   # bugbear
    "SIM", # flake8-simplify
    "ARG", # unused arguments
]
ignore = [
    "E501",
    "N812",
    "N999",
    "B904",
    # PEP 604 / 新式导入重写推迟到 v2.6（保持 v2.5 变更面最小）
    "UP006", # dict/list 泛型重写
    "UP007", # Union -> X|Y
    "UP035", # typing.* 导入重写
    "UP041", # IOError -> TimeoutError 别名
    "UP045", # Optional -> X|None
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
# 测试中 pytest fixture 参数未直接引用属于正常模式（如 patch 装饰器触发副作用）
"tests/test_async_ssh_client.py" = ["ARG002"]
# mock_paramiko fixture 以 patch 副作用生效，线程模型测试不直接引用其返回值
"tests/test_ssh_client.py" = ["ARG002"]
# Profile 合并测试中的 BareRepo stub 需保留与 HostRepository ABC 一致的签名
"tests/test_profile_merge.py" = ["ARG002"]
"tests/test_async_batch_executor.py" = ["ARG001", "ARG002"]
# 连接池测试中 patched_client fixture 触发 patch 副作用，factory 保留 cfg 参数以匹配真实签名
"tests/test_sync_connection_pool.py" = ["ARG001", "ARG002"]
# 性能测试中 mock stub 方法需保留与真实方法一致的签名（self/timeout 等）
"tests/performance/conftest.py" = ["ARG001"]
# 示例脚本中桩函数保留参数以展示 API 用法（函数体为注释占位）
"examples/*.py" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
no_implicit_optional = true
check_untyped_defs = false

# mypy strict 迁移（v2.10 完成）：整个 remote_cmd 包按 strict 检查；
# 基线 [tool.mypy] 的宽松设置仅作用于包外文件（如临时脚本）。
[[tool.mypy.overrides]]
module = ["remote_cmd.*"]
strict = true

[[tool.mypy.overrides]]
module = [
    "paramiko.*",
    "asyncssh.*",
    "click.*",
    "cryptography.*",
    "keyring.*",
    "yaml",
]
ignore_missing_imports = true
