[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remote_cmd_manager"
dynamic = ["version"]
description = "Cross-platform SSH remote server management tool (Linux/macOS/Windows) — lightweight, zero-configuration CLI and Python API for managing servers over SSH. Supports host CRUD, batch commands, file transfer, credential encryption, async execution, and more."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Vae-Scrooge", email = "vaescrooge@gmail.com" },
]
keywords = ["ssh", "remote", "server-management", "sysadmin", "devops", "cross-platform"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "paramiko>=3.0",
    "click>=8.0",
    "cryptography>=41.0",
    "rich>=13.0",
    "PyYAML>=6.0",
    "aiofiles>=3.0",
]

[project.optional-dependencies]
# 异步原生执行内核：启用 BatchExecutor(use_async=True) / AsyncSSHClient / AsyncConnectionPool 时需要
async = ["asyncssh>=2.14.0"]
# 云平台主机发现（Phase 4 预留）
cloud = ["boto3>=1.34"]
# 开发与测试
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]